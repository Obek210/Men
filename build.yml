          unzip -q jarvis.zip
          ls -R Jarvis | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: APK yig'ish
        working-directory: work/Jarvis
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK ni tayyorlash
        run: cp work/Jarvis/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Releases ga chiqarish (oddiy .apk, zip emas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Jarvis.apk \
            --repo "${{ github.repository }}" \
            --title "Jarvis APK #${{ github.run_number }}" \
            --notes "Tayyor APK. Yuklab oling va o'rnating."

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk
